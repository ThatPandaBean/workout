<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1419" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PPL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Push Pull Legs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one column training log. The day's color (push/pull/legs) is the only accent. */
:root{
  --bg:#EDF0F2;--surface:#FFFFFF;--panel:#F4F6F8;--ink:#16212B;--muted:#5D6A76;--line:#D3DAE0;
  --push:#C2410C;--pull:#1864AB;--legs:#237A35;--rest:#6B7680;--on-day:#FFFFFF;--day:var(--rest);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1419;--surface:#182028;--panel:#131A21;--ink:#E5EAEE;--muted:#98A4AF;--line:#2A343D;
  --push:#FF8A4C;--pull:#62A8EE;--legs:#5CC274;--rest:#8D98A2;--on-day:#0F1419;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1419;--surface:#182028;--panel:#131A21;--ink:#E5EAEE;--muted:#98A4AF;--line:#2A343D;
  --push:#FF8A4C;--pull:#62A8EE;--legs:#5CC274;--rest:#8D98A2;--on-day:#0F1419;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.d-push{--day:var(--push)}.d-pull{--day:var(--pull)}.d-legs{--day:var(--legs)}.d-rest{--day:var(--rest)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--day);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font-size:26px;text-transform:uppercase;letter-spacing:.04em}
.status{font-size:13px;color:var(--muted)}
.status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.status.ok::before{background:var(--legs)}.status.err::before{background:var(--push)}

.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.navbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 2px 7px;display:grid;justify-items:center;gap:1px;position:relative}
.wd small{font-size:12px;color:var(--muted)}
.wd b{font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.wd i{font-style:normal;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--day)}
.wd i+i{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.wd.today b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.wd.sel{background:var(--day);border-color:var(--day);color:var(--on-day)}
.wd.sel small,.wd.sel i,.wd.sel i+i{color:var(--on-day)}
.wd.logged::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--day)}
.wd.sel.logged::after{background:var(--on-day)}

.dayhead{display:grid;gap:10px}
.dayrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dayhead h2{font-size:clamp(48px,13vw,72px);line-height:.9;text-transform:uppercase;color:var(--day)}
.date{color:var(--muted);font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:7px;padding:6px 16px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--day);color:var(--on-day)}
.meta{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.meta strong{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar div{height:100%;background:var(--day);transition:width .3s}
.note{font-size:14px;color:var(--muted);margin:0;max-width:65ch}
.note a{color:var(--day)}

.list{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.card-h{display:flex;gap:12px;align-items:flex-start}
.card-h>div{flex:1;min-width:0}
.num{font-family:var(--display);font-size:30px;line-height:1;color:var(--day);min-width:1.1em}
.card h3{font-size:26px;line-height:1.05}
.target{font-size:14px;color:var(--muted)}
.swapbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.swapbtn[aria-expanded="true"]{border-color:var(--day);color:var(--day)}
.alts{display:grid;gap:6px;padding:10px;background:var(--panel);border-radius:10px}
.alts p{margin:0;font-size:13px;color:var(--muted)}
.alt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.alt span{display:grid;min-width:0}
.alt small{color:var(--muted);font-size:13px}
.alt[aria-pressed="true"]{border-color:var(--day);box-shadow:inset 3px 0 0 var(--day)}
.alt em{font-style:normal;font-size:12px;font-weight:600;color:var(--day);white-space:nowrap}
.rx{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.chip.main{background:var(--day);border-color:var(--day);color:var(--on-day)}
.chip.needs{border-style:dashed}
.stage{background:var(--panel);border-radius:10px;padding:6px}
.stage svg{width:100%;max-height:300px;height:auto;display:block}
.phase{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.phase b{font-family:var(--display);font-size:20px;color:var(--day);font-variant-numeric:tabular-nums}
.phase span{display:flex;gap:8px;align-items:center}
.track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.track div{height:100%;background:var(--day);width:0}
.vid{font-size:14px;font-weight:600;color:var(--day)}
.steps{margin:0;padding-left:1.3em;display:grid;gap:4px;max-width:65ch}
.tip{font-size:14px;margin:0;padding:8px 10px;border-radius:8px;background:var(--panel);max-width:65ch}
.tip b{color:var(--day)}
.log{display:grid;gap:6px}
.log-h,.row{display:grid;grid-template-columns:3.2em 1fr 1fr 3em;gap:8px;align-items:center}
.log.nowt .log-h,.log.nowt .row{grid-template-columns:3.2em 1fr 3em}
.log-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row label.sn{font-family:var(--display);font-size:18px;color:var(--muted)}
.row input[type=number]{width:100%;min-width:0;box-sizing:border-box;font:inherit;font-variant-numeric:tabular-nums;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.row input[type=checkbox]{width:26px;height:26px;accent-color:var(--day);justify-self:center;margin:0}
.row.done label.sn{color:var(--day)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.last{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.restbtn{border:1px solid var(--day);color:var(--day);background:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px}

.sec{font-size:24px;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px}
.sec small{font-family:var(--body);font-size:14px;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500}
.timeline{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.timeline i{background:var(--line)}.timeline i.jog{background:var(--day)}
.rt{display:grid;gap:6px;padding:14px 12px;border-radius:10px;background:var(--panel);justify-items:center;text-align:center}
.rt-main{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;justify-content:center}
.rt-main b{font-family:var(--display);font-size:32px;text-transform:uppercase;color:var(--day)}
.rt-main span{font-family:var(--display);font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.rt-sub{font-size:14px;color:var(--muted)}
.runlog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.runlog input[type=number]{width:6.5em;box-sizing:border-box;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.runlog input[type=checkbox]{width:24px;height:24px;accent-color:var(--day);margin:0}
.runlog label{display:flex;align-items:center;gap:6px;font-weight:600}
.runlog span{color:var(--muted);font-size:14px}
.restday{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:8px}
.restday p{margin:0;max-width:65ch}

.hist{display:grid;gap:8px}
.hist h3{font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.hrow{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.hrow span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hrow b{color:var(--day)}
.empty{color:var(--muted);font-size:14px;margin:0}

.timer[hidden]{display:none}
.timer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);display:flex;justify-content:center;align-items:center;gap:16px}
.timer b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.timer button{background:none;border:1px solid var(--bg);color:var(--bg);border-radius:8px;padding:5px 12px;font-size:14px}

/* figure */
.floor{stroke:var(--line);stroke-width:2}
.b{stroke:var(--ink);stroke-width:7;stroke-linecap:round;fill:none}
.b.hl{stroke:var(--day)}
.far{opacity:.32}
.head{fill:var(--ink)}
.pf{fill:var(--line);stroke:var(--muted);stroke-width:1}
.pl{stroke:var(--muted);stroke-width:3;stroke-linecap:round;fill:none}
.pthin{stroke:var(--muted);stroke-width:1.5;fill:none}
.pdot{fill:var(--muted)}
.pad{stroke:var(--line);stroke-width:7;stroke-linecap:round}
.towel{stroke:var(--day);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:4 3;fill:none}
@media (prefers-reduced-motion: reduce){.bar div{transition:none}}
@media (max-width:420px){.card{padding:12px}}
</style>

<div class="wrap d-rest" id="app">
  <header class="top">
    <h1>Push Pull Legs</h1>
    <span class="status" id="status">Loading your log</span>
  </header>
  <nav class="weeknav" aria-label="Week">
    <button class="navbtn" data-week="-7" aria-label="Previous week">&#8249; Prev</button>
    <span id="weeklabel"></span>
    <button class="navbtn" data-week="7" aria-label="Next week">Next &#8250;</button>
  </nav>
  <div class="week" id="week"></div>
  <section class="dayhead" id="dayhead"></section>
  <section class="list" id="list"></section>
  <section class="hist" id="hist"></section>
  <p class="note">Want to learn calisthenics skills later (handstand, muscle-up)? <a href="https://wingssw.com/#/skilltree">Wings skill tree</a> shows the order to learn them in.</p>
</div>
<div class="timer" id="timer" hidden>
  <span>Rest</span><b id="timerT">0:00</b><button id="timerX">Skip</button>
</div>

<script>
// ---------- exercise library ----------
// Poses use joint angles in degrees: 0 = right, 90 = down, -90 = up. Figure faces right.
// t torso (hip to shoulder), l [thigh, shin], a [upper arm, forearm], fa foot. Index 1 = near side, 2 = far side.
// Animation: go = start->end phase [label, seconds], back = end->start. pin = point that never moves,
// fix = hands/feet that stay planted (the arm or leg bends to reach them).
const PUSHUP_START={t:-26,l:[154,154],a:[90,90],fa:30},PUSHUP_END={t:-5,l:[175,175],a:[-145,80],fa:5};
const ROW_START={t:-8,l:[172,172],a:[-85,-85],fa:-95},ROW_END={t:-14,l:[166,166],a:[-120,-43],fa:-95};
const SQUAT_START={t:-88,l:[90,90],a:[0,0]},SQUAT_END={t:-55,l:[10,100],a:[5,5]};
const E={
 // ----- home push -----
 pushup:{name:'Push-up',target:'Chest, shoulders, triceps',sets:3,reps:'8-15',rest:90,hx:110,hl:['u','f'],pin:'t1',fix:['w1','w2'],go:['Lower',2],back:['Push up',1],
  start:PUSHUP_START,end:PUSHUP_END,
  steps:['Hands a little wider than your shoulders, body in one straight line from head to heels.','Lower until your chest is about a fist from the floor, elbows about 45° from your sides.','Push the floor away until your arms are straight.'],
  tip:'<b>Harder:</b> at 15 reps on every set, swap to decline push-ups. <b>Easier:</b> swap to incline push-ups.'},
 inclinepush:{name:'Incline push-up',target:'Chest, shoulders, triceps',sets:3,reps:'10-15',rest:60,hx:105,hl:['u','f'],pin:'t1',fix:['w1','w2'],go:['Lower',2],back:['Push up',1],
  props:[{type:'box',at:'w1',w:30}],
  start:{t:-51,l:[129,129],a:[90,90],fa:60},end:{t:-38,l:[142,142],a:[158,73],fa:60},
  steps:['Hands on the edge of a sturdy chair pushed against a wall, or a table. Walk your feet back until your body is straight.','Lower your chest to the edge, elbows about 45° from your sides.','Push back up to straight arms.'],
  tip:'<b>Easier</b> than a floor push-up. Use it if you can\'t get 8 regular ones.'},
 declinepush:{name:'Decline push-up',target:'Upper chest, shoulders, triceps',sets:3,reps:'6-12',rest:90,hx:110,hl:['u','f'],pin:'t1',fix:['w1','w2'],go:['Lower',2],back:['Push up',1],
  props:[{type:'box',at:'t1',w:26,d:[2,0]}],
  start:{t:3,l:[-177,-177],a:[90,90],fa:75},end:{t:18,l:[-162,-162],a:[-150,75],fa:75},
  steps:['Feet on a chair or bed, hands on the floor a little wider than your shoulders.','Lower your chest toward the floor with your body straight.','Push back up.'],
  tip:'<b>Harder</b> than a regular push-up. It puts more work on your upper chest and shoulders.'},
 pike:{name:'Pike push-up',target:'Shoulders, triceps',sets:3,reps:'6-10',rest:90,hx:80,hl:['u','f'],pin:'t1',fix:['w1','w2'],go:['Lower',2],back:['Press up',1],
  start:{t:30,l:[105,105],a:[55,55],fa:20},end:{t:45,l:[120,120],a:[5,80],fa:20},
  steps:['Start in a push-up, walk your feet in and lift your hips so your body makes an upside-down V.','Bend your elbows and lower the top of your head toward the floor just in front of your hands.','Press back up to straight arms. Keep your hips high the whole time.'],
  tip:'<b>Harder:</b> at 10 easy reps, swap to the elevated pike.'},
 elevpike:{name:'Elevated pike push-up',target:'Shoulders, triceps',sets:3,reps:'5-10',rest:90,hx:110,hl:['u','f'],pin:'t1',fix:['w1','w2'],go:['Lower',2],back:['Press up',1],
  props:[{type:'box',at:'t1',w:26,d:[-4,0]}],
  start:{t:65,l:[140,140],a:[75,75],fa:80},end:{t:80,l:[150,150],a:[10,80],fa:80},
  steps:['Feet on a chair, hands on the floor, hips stacked high over your shoulders.','Bend your elbows and lower your head toward the floor in front of your hands.','Press back up.'],
  tip:'<b>Harder:</b> the closer your hands are to the chair, the more upright you are and the harder it gets.'},
 bpress:{name:'Backpack overhead press',vb:'0 -18 200 148',target:'Shoulders, triceps',needs:'Backpack with books',sets:3,reps:'8-12',rest:60,hx:100,hl:['u','f'],go:['Press up',1],back:['Lower',2],
  props:[{type:'pack',at:'w1',d:[2,-4]}],
  start:{t:-90,l1:[90,90],l2:[88,92],a:[100,-85]},end:{t:-90,l1:[90,90],l2:[88,92],a:[-88,-88]},
  steps:['Fill a backpack with books and hold it by the sides at shoulder height.','Press it straight overhead until your arms are straight. Squeeze your glutes so your lower back doesn\'t arch.','Lower slowly to your shoulders.'],
  tip:'<b>Weight:</b> add or remove books so 8-12 reps is hard.'},
 chairdip:{name:'Chair dip',target:'Triceps, chest',sets:3,reps:'8-12',rest:90,hx:95,hl:['u','f'],pin:'t1',fix:['w1','w2'],go:['Lower',2],back:['Press up',1],
  props:[{type:'box',at:'w1',w:30,d:[-10,0]}],
  start:{t:-88,l:[0,90],a:[95,95]},end:{t:-85,l:[-30,72],a:[160,80]},
  steps:['Push a sturdy chair against a wall. Sit on the edge, hands next to your hips, fingers forward.','Slide your hips off the front and lower until your elbows bend to about 90°.','Press back up until your arms are straight.'],
  tip:'<b>Careful:</b> stop going deep if your shoulders hurt. <b>Harder:</b> straighten your legs.'},
 diamond:{name:'Diamond push-up',target:'Triceps, chest',sets:3,reps:'6-12',rest:90,hx:110,hl:['u','f'],pin:'t1',fix:['w1','w2'],go:['Lower',2],back:['Push up',1],
  start:PUSHUP_START,end:PUSHUP_END,
  steps:['Push-up position with your hands together under your chest, thumbs and index fingers touching to make a diamond.','Lower slowly, keeping your elbows close to your sides.','Push back up to straight arms.'],
  tip:'<b>Easier:</b> do them with your knees down if you can\'t get 6.'},
 bpext:{name:'Backpack triceps extension',vb:'0 -18 200 148',target:'Triceps',needs:'Backpack with books',sets:3,reps:'10-15',rest:60,hx:100,hl:['f'],go:['Straighten',1],back:['Lower behind head',2],
  props:[{type:'pack',at:'w1',d:[-2,-2]}],
  start:{t:-90,l1:[90,90],l2:[88,92],a:[-100,120]},end:{t:-90,l1:[90,90],l2:[88,92],a:[-95,-95]},
  steps:['Hold a loaded backpack overhead with both hands, elbows pointing up.','Lower it behind your head by bending only your elbows.','Straighten your arms to lift it back up.'],
  tip:'<b>Check:</b> keep your elbows pointing at the ceiling, not flaring out.'},
 plank:{name:'Plank',target:'Core, shoulders',sets:2,reps:'20-45',hold:true,rest:45,hx:95,hl:['tor','th'],go:['Lift into plank',1.5],back:['Knees down',1],
  start:{t:-20,l:[160,180],a:[90,0],fa:180},end:{t:-14,l:[166,166],a:[90,0],fa:70},
  steps:['Forearms on the floor, elbows under your shoulders.','Lift your knees so your body is straight from head to heels.','Squeeze your glutes and stomach and hold. Don\'t let your hips sag.'],
  tip:'<b>Easier:</b> keep your knees down.'},
 hollow:{name:'Hollow hold',target:'Core',sets:2,reps:'15-30',hold:true,rest:45,hx:96,hl:['tor','th'],go:['Lift',1.5],back:['Lower',1],
  start:{t:180,l:[0,0],a:[180,180],lift:5},end:{t:-170,l:[-15,-15],a:[-165,-165],fa:-15,lift:3},
  steps:['Lie on your back, arms overhead.','Press your lower back into the floor, then lift your shoulders and legs a few inches.','Hold. If your lower back lifts off the floor, bend your knees.'],
  tip:'<b>Easier:</b> bend your knees and keep your arms by your sides.'},

 // ----- home pull -----
 tablerow:{name:'Table row',target:'Upper back, biceps',sets:4,reps:'6-12',rest:90,hx:92,hl:['u','f'],pin:'t1',fix:['w1','w2'],go:['Pull',1],back:['Lower',2],
  props:[{type:'table',at:'w1'}],
  start:ROW_START,end:ROW_END,
  steps:['Lie under a sturdy table and grab the edge with both hands, shoulder width apart.','Keep your body straight, heels on the floor, and pull your chest up to the edge.','Lower slowly until your arms are straight.'],
  tip:'<b>Careful:</b> test the table first. It must not tip when you pull. A heavy desk against a wall is safest. <b>Harder:</b> pause 2 seconds at the top.'},
 broomrow:{name:'Broom row',target:'Upper back, biceps',needs:'Broom and two chairs',sets:4,reps:'6-12',rest:90,hx:92,hl:['u','f'],pin:'t1',fix:['w1','w2'],go:['Pull',1],back:['Lower',2],

// ---------- stick figure ----------
const FL=118, LEN={T:34,N:13,U:21,F:20,TH:26,SH:26,FT:8};
const mv=(p,a,l)=>[p[0]+Math.cos(a*Math.PI/180)*l,p[1]+Math.sin(a*Math.PI/180)*l];
function solve(pose,ex,shift){
  const l1=pose.l1||pose.l,l2=pose.l2||l1,a1=pose.a1||pose.a,a2=pose.a2||a1;
  const fa1=pose.fa1??pose.fa??0,fa2=pose.fa2??pose.fa??fa1;
  const P={hip:[0,0]};
  P.sh=mv(P.hip,pose.t,LEN.T);P.hd=mv(P.sh,pose.hd??pose.t,LEN.N);
  P.k1=mv(P.hip,l1[0],LEN.TH);P.f1=mv(P.k1,l1[1],LEN.SH);P.t1=mv(P.f1,fa1,LEN.FT);
  P.k2=mv(P.hip,l2[0],LEN.TH);P.f2=mv(P.k2,l2[1],LEN.SH);P.t2=mv(P.f2,fa2,LEN.FT);
  P.e1=mv(P.sh,a1[0],LEN.U);P.w1=mv(P.e1,a1[1],LEN.F);
  P.e2=mv(P.sh,a2[0],LEN.U);P.w2=mv(P.e2,a2[1],LEN.F);
  let dx,dy;
  if(shift)[dx,dy]=shift;
  else{
    dy=pose.hy!=null?pose.hy:FL-Math.max(...['hip','sh','k1','f1','t1','k2','f2','t2','e1','w1','e2','w2'].map(k=>P[k][1]))-(pose.lift||0);
    dx=pose.hx??ex.hx??100;
  }
  for(const k in P)P[k]=[P[k][0]+dx,P[k][1]+dy];
  Object.defineProperty(P,'s',{value:[dx,dy]});
  return P;
}
const n=v=>Math.round(v*10)/10;
const ln=(a,b,c,extra='')=>`<line x1="${n(a[0])}" y1="${n(a[1])}" x2="${n(b[0])}" y2="${n(b[1])}" class="${c}" ${extra}/>`;
function props(ex,P,end){
  return (ex.props||[]).map(pr=>{
    const off=(end&&pr.d2)||pr.d||[0,0];
    const p=pr.at?[P[pr.at][0]+off[0],P[pr.at][1]+off[1]]:null;
    const rel=s=>[P[s[0]][0]+s[1],P[s[0]][1]+s[2]];
    switch(pr.type){
      case 'box':{const y=p[1]+3;return `<rect class="pf" x="${n(p[0]-pr.w/2)}" y="${n(y)}" width="${pr.w}" height="${n(Math.max(0,FL+3-y))}" rx="2"/>`}
      case 'table':return `<rect class="pf" x="${n(p[0]-45)}" y="${n(p[1]-1)}" width="75" height="5" rx="1"/>`+ln([p[0]+26,p[1]+4],[p[0]+26,FL+3],'pl');
      case 'door':{const x=p[0]+pr.dx,hy=FL-61;return `<rect class="pf" x="${n(x)}" y="${FL-108}" width="6" height="111"/><circle class="pdot" cx="${n(x-1)}" cy="${hy}" r="2.5"/>`+ln(P.w1,[x-1,hy],'towel')}
      case 'towel':return ln(P[pr.at],P[pr.to],'towel');
      case 'wall':{const x=p[0]+pr.dx;return `<rect class="pf" x="${n(x-6)}" y="${FL-112}" width="6" height="115"/>`}
      case 'seat':{const h=P.hip,bo=pr.bo||[-6,0];return (pr.back?ln([h[0]+bo[0],h[1]+bo[1]],[P.sh[0]+bo[0],P.sh[1]+bo[1]],'pad'):'')+
        `<rect class="pf" x="${n(h[0]-14)}" y="${n(h[1]+3)}" width="28" height="5" rx="2"/>`+ln([h[0],h[1]+8],[h[0],FL+3],'pl')}
      case 'backpad':{const bo=pr.bo;return ln([P.hip[0]+bo[0],P.hip[1]+bo[1]],[P.sh[0]+bo[0],P.sh[1]+bo[1]],'pad')}
      case 'bench':{const x0=Math.min(P.hip[0],P.sh[0])-6,x1=Math.max(P.hip[0],P.sh[0])+8,y=P.hip[1]+4;
        return `<rect class="pf" x="${n(x0)}" y="${n(y)}" width="${n(x1-x0)}" height="5" rx="2"/>`+ln([x0+4,y+5],[x0+4,FL+3],'pl')+ln([x1-4,y+5],[x1-4,FL+3],'pl')}
      case 'handle':return `<circle class="pdot" cx="${n(p[0])}" cy="${n(p[1])}" r="3.5"/>`;
      case 'post':return ln([p[0],p[1]+3],[p[0],FL+3],'pl')+`<circle class="pdot" cx="${n(p[0])}" cy="${n(p[1])}" r="3.5"/>`;

      case 'lever':{const q=rel(pr.pivot);return ln(q,p,'pl')+`<circle class="pf" cx="${n(q[0])}" cy="${n(q[1])}" r="4"/><circle class="pdot" cx="${n(p[0])}" cy="${n(p[1])}" r="3.5"/>`}
      case 'cable':{const q=rel(pr.to);return ln(p,q,'pthin')+`<circle class="pf" cx="${n(q[0])}" cy="${n(q[1])}" r="5"/><circle class="pdot" cx="${n(p[0])}" cy="${n(p[1])}" r="3.5"/>`}
      case 'pad':return `<rect class="pf" x="${n(p[0]-pr.w/2)}" y="${n(p[1]-pr.h/2)}" width="${pr.w}" height="${pr.h}" rx="3"/>`;
      case 'roller':return `<circle class="pf" cx="${n(p[0])}" cy="${n(p[1])}" r="5"/>`;

function figureP(ex,P,end){
  const hl=new Set(ex.hl||[]);

  ${ln([-20,FL+4],[220,FL+4],'floor')}${props(ex,P,end)}
  ${ln(P.hip,P.k2,c('th',1))}${ln(P.k2,P.f2,c('sh',1))}${ln(P.f2,P.t2,'b far')}
  ${ln(P.sh,P.e2,c('u',1))}${ln(P.e2,P.w2,c('f',1))}
  ${ln(P.hip,P.sh,c('tor'))}${ln(P.sh,neck,'b')}
  ${ln(P.hip,P.k1,c('th'))}${ln(P.k1,P.f1,c('sh'))}${ln(P.f1,P.t1,'b')}
  ${ln(P.sh,P.e1,c('u'))}${ln(P.e1,P.w1,c('f'))}
  <circle class="head" cx="${n(P.hd[0])}" cy="${n(P.hd[1])}" r="8.5"/></svg>`;
}

function norm(p){ // spell every field out so two poses can be blended
  const l1=p.l1||p.l,a1=p.a1||p.a,fa1=p.fa1??p.fa??0;
  return {t:p.t,hd:p.hd??p.t,l1,l2:p.l2||l1,a1,a2:p.a2||a1,fa1,fa2:p.fa2??p.fa??fa1,hy:p.hy,hx:p.hx,lift:p.lift||0};
}
const ANG=new Set(['t','hd','l1','l2','a1','a2','fa1','fa2']);
function blend(A,B,u){
  const o={};
  for(const k in A){
    const a=A[k],b=B[k];
    if(a==null||b==null){o[k]=a??b;continue}
    const mix=(x,y)=>{if(!ANG.has(k))return x+(y-x)*u;const d=((y-x)%360+540)%360-180;return x+d*u}; // shortest way round
    o[k]=Array.isArray(a)?a.map((x,i)=>mix(x,b[i])):mix(a,b);
  }
  return o;
}
const CH={w1:['sh','e1',LEN.U,LEN.F],w2:['sh','e2',LEN.U,LEN.F],f1:['hip','k1',LEN.TH,LEN.SH],f2:['hip','k2',LEN.TH,LEN.SH]};
const TOE={f1:['t1','fa1'],f2:['t2','fa2']};
function ik(R,T,a,b,bend){

async function connect(){

// Sync with any store that has doc().set() and onSnapshot() on a collection: Claude's db here, Firestore in the home-screen app.
let unsubStore=null;
function attachStore(store,collection){
  detachStore();

  unsubStore=col.onSnapshot(snap=>{
    const next={};let nextPrefs=null;
    snap.docs.forEach(doc=>{const v=JSON.parse(JSON.stringify(doc.data())); // snapshot data can be frozen; keep an editable copy
      if(doc.id==='prefs')nextPrefs=v;else next[doc.id]=v});
    for(const k in logs){
      if(dirty[k])next[k]=logs[k];
      else if(!snap.metadata.fromCache&&(!(k in next)||(logs[k].updated||0)>(next[k].updated||0))){next[k]=logs[k];queueSave(k)} // device-only or newer days go up
    }

      if(nextPrefs)prefs={slots:{},...nextPrefs};

}
function detachStore(){if(unsubStore)unsubStore();unsubStore=null;db=null;col=null;setStatus('local')}
function queueSave(k){

  setStatus('saving');clearTimeout(timers[k]);

    if(!col){delete dirty[k];return} // signed out in the meantime; the change is already saved on the device

const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};

// Which exercise fills each slot on a date: what you logged that day, else your saved pick, else the default.

}

// ---------- running: NHS Couch to 5K (nhs.uk running plan) ----------
const RUN_DAYS=[0,2,4]; // Sun, Tue, Thu

 [seq(300,180,300,180,300),seq(480,300,480),seq(1200)],

const runPlan=i=>{const w=Math.floor(i/3),r=i%3,mid=C25K[w][r]||C25K[w][0];return {week:w+1,run:r+1,mid,segs:[['Warm-up walk',300],...mid,['Cool-down walk',300]]}};
const PACE={jog:13,walk:18}; // assumed minutes per mile, only for the rough distance
const estMiles=segs=>segs.reduce((m,[k,s])=>m+s/60/(k==='Jog'?PACE.jog:PACE.walk),0);
const km=mi=>mi*1.609344;
const dist=mi=>`${mi.toFixed(1)} mi (${km(mi).toFixed(1)} km)`;

  const done=Object.keys(logs).filter(x=>isDate(x)&&x<k&&logs[x].run?.done).length;

// ---------- time estimates ----------
// One exercise: middle of the rep range at the animation's tempo (or the middle hold time), every set, rests between sets.
const midReps=r=>{const [a,b]=String(r).split('-').map(Number);return (a+(b||a))/2};

  const ex=E[id],m=midReps(ex.reps),rep=ex.go[1]+ex.back[1]+2*(ex.pause??500)/1000;

const sectionSeconds=(ids,warmup)=>ids.reduce((s,id,i)=>s+exSeconds(id)+(i<ids.length-1?E[id].rest:0),0)+(warmup?300:0);

  document.getElementById('hist').innerHTML=`<h3>Recent workouts</h3>`+(hk.length?hk.map(k=>{
    const t=logs[k].day||SCHED[parse(k).getDay()],m=logs[k].mode||'home',[dn,tt]=progress(k,t,m);
    return `<button class="hrow d-${t}" data-date="${k}"><span><b>${LABEL[t]}</b>${logs[k].run?.done?' + Run':''} · ${m==='gym'?'Gym':'Home'} · ${parse(k).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</span><span>${dn}/${tt} sets</span></button>`}).join('')
    :'<p class="empty">Nothing logged yet. Tick off a set and it shows up here.</p>');
}
function card(id,i,type,mode){
  const ex=E[id],sets=setsFor(sel,id),unit=ex.hold?'sec':'reps',slot=PLAN[type][mode][i],sk=`${type}-${mode}-${i}`,open=openSlot===sk;
  const locked=hasData(sel,id);
  const rows=sets.map((s,j)=>`<div class="row${s.d?' done':''}">
    <label class="sn" for="r-${id}-${j}">Set ${j+1}</label>
    <input type="number" inputmode="numeric" min="0" id="r-${id}-${j}" data-ex="${id}" data-i="${j}" data-f="r" value="${esc(s.r)}" placeholder="${ex.reps.split('-')[0]}" aria-label="Set ${j+1} ${unit}">
    ${ex.wt?`<input type="number" inputmode="decimal" min="0" step="2.5" id="w-${id}-${j}" data-ex="${id}" data-i="${j}" data-f="w" value="${esc(s.w)}" placeholder="lb" aria-label="Set ${j+1} weight in pounds">`:''}
    <input type="checkbox" id="d-${id}-${j}" data-ex="${id}" data-i="${j}" data-f="d" ${s.d?'checked':''} aria-label="Set ${j+1} done"></div>`).join('');
  const alts=open?`<div class="alts" id="alts-${sk}"><p>${locked?'You already logged sets for this exercise today. Clear them to switch.':'Same muscles, different exercise. Your pick is remembered.'}</p>${slot.map(x=>{const a=E[x];
    return `<button class="alt" data-pick="${x}" data-slot="${sk}" aria-pressed="${x===id}" ${locked&&x!==id?'disabled':''}><span><b>${a.name}</b><small>${a.target}${a.needs?' · Needs: '+a.needs:''}</small></span>${x===id?'<em>Current</em>':''}</button>`}).join('')}</div>`:'';
  const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(ex.name+' exercise form');
  return `<article class="card">
    <div class="card-h"><span class="num">${i+1}</span><div><h3>${ex.name}</h3><div class="target">${ex.target}</div></div>
      ${slot.length>1?`<button class="swapbtn" data-swap="${sk}" aria-expanded="${open}" aria-controls="alts-${sk}">Swap (${slot.length-1})</button>`:''}</div>
    ${alts}
    <div class="rx"><span class="chip main">${ex.sets} sets × ${ex.reps} ${unit}${ex.side?' each side':''}</span><span class="chip">Rest ${ex.rest}s</span><span class="chip">About ${mins(exSeconds(id))}</span>${ex.needs?`<span class="chip needs">Needs: ${ex.needs}</span>`:''}</div>
    <div class="stage" data-ex="${id}" data-slot="${sk}"></div>
    <div class="phase"><b id="ph-${sk}"></b><span><a class="vid" href="${yt}" target="_blank" rel="noopener">Watch a video &#8599;</a><button class="restbtn" data-play="${sk}">${RM?'Play':'Pause'}</button></span></div>
    <div class="track"><div id="tr-${sk}"></div></div>
    <ol class="steps">${ex.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
    <p class="tip">${ex.tip}</p>
    <div class="log${ex.wt?'':' nowt'}"><div class="log-h"><span></span><span>${ex.hold?'Seconds':'Reps'}</span>${ex.wt?'<span>Weight (lb)</span>':''}<span style="text-align:center">Done</span></div>${rows}</div>
    <div class="foot"><span class="last">${lastTime(id)||'First time doing this one.'}</span><button class="restbtn" data-rest="${ex.rest}">Start ${ex.rest}s rest</button></div>
  </article>`;
}

// ---------- events ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-date],[data-week],[data-mode],[data-rest],[data-swap],[data-pick],[data-play],[data-runtimer],[data-runadj]');if(!b)return;
  if(b.dataset.runtimer){rt?stopRunTimer():startRunTimer();return}
  if(b.dataset.runadj){prefs.runAdj=(prefs.runAdj||0)+(+b.dataset.runadj);queueSave('prefs');render();return}
  if(b.dataset.date){sel=b.dataset.date;openSlot=null;render();window.scrollTo({top:0})}
  else if(b.dataset.week){sel=addDays(sel,+b.dataset.week);openSlot=null;render()}
  else if(b.dataset.mode){
    const m=b.dataset.mode;lsSet(LSM,m);
    if(logs[sel]){logs[sel].mode=m;queueSave(sel)}
    openSlot=null;render();
  }else if(b.dataset.swap){openSlot=openSlot===b.dataset.swap?null:b.dataset.swap;render()}
  else if(b.dataset.pick){
    prefs.slots=prefs.slots||{};prefs.slots[b.dataset.slot]=b.dataset.pick;queueSave('prefs');
    openSlot=null;render();
  }else if(b.dataset.play){
    const r=runs.find(x=>x.el.dataset.slot===b.dataset.play);if(!r)return;
    r.paused=!r.paused;if(!r.paused)r.t0=performance.now()-r.at;
    b.textContent=r.paused?'Play':'Pause';
  }else if(b.dataset.rest)startRest(+b.dataset.rest);
});
document.addEventListener('input',e=>{
  const t=e.target,type=SCHED[parse(sel).getDay()];
  if(t.dataset.run){
    const log=logs[sel]||(logs[sel]={day:type,mode:modeFor(sel),sets:{}});
    log.run=log.run||{};log.day=type;log.updated=Date.now();
    if(t.dataset.run==='done')log.run.done=t.checked;
    else{log.run.mi=t.value;document.getElementById('run-km').textContent=t.value?`mi = ${km(+t.value).toFixed(2)} km`:'miles (optional)'}
    queueSave(sel);return;
  }
  if(!t.dataset.ex)return;
  const id=t.dataset.ex,i=+t.dataset.i,f=t.dataset.f;
  const log=logs[sel]||(logs[sel]={day:type,mode:modeFor(sel),sets:{}});
  log.sets=log.sets||{};
  const arr=log.sets[id]||(log.sets[id]=setsFor(sel,id).map(s=>({...s})));
  arr[i][f]=f==='d'?t.checked:t.value;
  log.day=type;log.updated=Date.now();
  if(f==='d'){
    t.closest('.row').classList.toggle('done',t.checked);
    const [dn,tt]=progress(sel,type,modeFor(sel));
    document.getElementById('donec').textContent=`${dn} / ${tt}`;
    document.getElementById('donebar').style.width=(tt?dn/tt*100:0)+'%';
  }
  queueSave(sel);
});

// ---------- rest timer ----------
const timer=document.getElementById('timer'),timerT=document.getElementById('timerT');
let tEnd=0,tInt=null;
function startRest(s){tEnd=Date.now()+s*1000;timer.hidden=false;tick();clearInterval(tInt);tInt=setInterval(tick,250)}
function tick(){
  const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  timerT.textContent=left?`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'Go';
  if(!left){clearInterval(tInt);setTimeout(()=>{if(Date.now()>=tEnd)timer.hidden=true},4000)}
}
document.getElementById('timerX').onclick=()=>{clearInterval(tInt);timer.hidden=true};

render();
connect();
</script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script>
// ---------- home-screen app extras: offline, sync, backup ----------
(function(){
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){} // ask the phone not to clear the log
  const HOME='https://thatpandabean-workout.firebaseapp.com/';
  const moved=location.hostname.endsWith('github.io'); // the old address: sign-in only works on the Firebase one

  const box=document.createElement('section');box.className='hist';
  box.innerHTML=
    (moved?'<div class="restday"><p><b>This app moved to <a href="'+HOME+'">'+HOME.replace('https://','').replace(/\/$/,'')+'</a></b>, which can sync between your phone and computer.</p>'+
      '<p class="note">To bring your log along: tap <b>Save backup file</b> below, open the new link, add it to your home screen, then use <b>Import backup</b> there. After that you can delete this old icon.</p></div>':'')+
    '<h3>Sync</h3><p class="note" id="sy-text">'+(moved?'Sync works in the new app, not on this old address.':'Sign in with Google to keep your phone and computer in step. Your log stays on this device too, so it works offline.')+'</p>'+
    '<div class="foot" id="sy-row"'+(moved?' hidden':'')+'><button class="navbtn" id="sy-in">Sign in with Google</button><button class="navbtn" id="sy-out" hidden>Sign out</button></div>'+
    '<h3>Backup</h3><p class="note">Save a backup file now and then. Import it if you switch phones or clear your browser.</p>'+
    '<div class="foot"><button class="navbtn" id="bk-export">Save backup file</button><label class="navbtn" for="bk-import" style="cursor:pointer">Import backup</label><input type="file" id="bk-import" accept="application/json,.json" hidden></div>'+
    '<p class="note" id="bk-msg" role="status"></p>';
  document.getElementById('hist').after(box);
  const msg=t=>{document.getElementById('bk-msg').textContent=t};
  const $=id=>document.getElementById(id);

  // ---- sync ----
  if(!moved){
    if(!window.firebase){$('sy-text').textContent='Sync needs an internet connection the first time you open the app. Your log is saved on this device.'}
    else{
      firebase.initializeApp({"apiKey":"AIzaSyARFVUoKYQiJpTChcldl_Oh7Xl2BuB9rFQ","authDomain":"thatpandabean-workout.firebaseapp.com","projectId":"thatpandabean-workout","storageBucket":"thatpandabean-workout.firebasestorage.app","messagingSenderId":"763233204104","appId":"1:763233204104:web:b4009fc0677f6ad813ac3d"});
      const auth=firebase.auth(),store=firebase.firestore();
      try{store.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){} // keep working offline, catch up later
      auth.getRedirectResult().catch(e=>{$('sy-text').textContent='Sign-in didn\'t finish ('+(e.code||'error')+'). Try again.'});
      auth.onAuthStateChanged(user=>{
        $('sy-in').hidden=!!user;$('sy-out').hidden=!user;
        if(user){
          $('sy-text').textContent='Signed in as '+(user.email||'your Google account')+'. Your log syncs with every device where you sign in.';
          attachStore(store,store.collection('users/'+user.uid+'/log'));
        }else{
          $('sy-text').textContent='Sign in with Google to keep your phone and computer in step. Your log stays on this device too, so it works offline.';
          detachStore();
        }
      });
      $('sy-in').onclick=()=>{$('sy-text').textContent='Opening Google sign-in...';auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider())};
      $('sy-out').onclick=()=>auth.signOut(); // the log stays on this device
    }
  }

  // ---- backup ----
  $('bk-export').onclick=()=>{
    const data={app:'ppl',version:1,saved:new Date().toISOString(),logs,prefs};
    const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download='workout-backup-'+today+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
    msg('Backup saved. Keep the file somewhere safe, like the Files app, Google Drive or an email to yourself.');
  };
  $('bk-import').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      if(d.app!=='ppl'||!d.logs||typeof d.logs!=='object')throw new Error('not a backup');
      let n=0;
      for(const k in d.logs)if(isDate(k)&&(!logs[k]||(d.logs[k].updated||0)>=(logs[k].updated||0))){logs[k]=d.logs[k];queueSave(k);n++}
      prefs=Object.assign({slots:{}},prefs,d.prefs||{},{slots:Object.assign({},prefs.slots,(d.prefs||{}).slots)});
      queueSave('prefs');render();
      msg('Imported '+n+' day'+(n===1?'':'s')+' from the backup.');
    }catch(err){msg('That file isn\'t a backup from this app, so nothing was changed.')}
    e.target.value='';
  };
})();
</script>
